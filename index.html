<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e36b1e'/%3E%3Ccircle cx='16' cy='13' r='5' fill='%23ffd15a'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Astromech Galaxy Run</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#081236;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;-webkit-user-select:none;user-select:none;border:0;outline:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
#hud .left{display:flex;flex-direction:column;gap:2px;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.25)}
#power{display:flex;gap:5px;align-items:flex-end;height:30px}
#power .cell{width:16px;height:26px;border-radius:4px;border:2px solid #d8fff4;background:#0d2e28;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#power .cell::before{content:"";position:absolute;left:3px;right:3px;top:-5px;height:4px;border-radius:2px 2px 0 0;background:#d8fff4}
#power .cell::after{content:"";position:absolute;left:3px;right:3px;top:3px;bottom:3px;border-radius:2px;background:linear-gradient(#f4fff9,#3dffc2);box-shadow:0 0 8px #3dffc2}
#power .cell.off{border-color:rgba(180,210,200,.4);background:rgba(0,0,0,.28)}
#power .cell.off::before{background:rgba(180,210,200,.35)}
#power .cell.off::after{background:transparent;box-shadow:none}
#power .cell.warn::after{animation:lowpower .32s steps(2) infinite}
@keyframes lowpower{50%{opacity:.2;box-shadow:none}}
#score{font-size:24px;line-height:1.1}
#bolts{font-size:19px;color:#fff3a8;line-height:1.1}
#hud .right{display:flex;gap:10px;pointer-events:auto}
.hb{min-width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.88);color:#3b2a6b;font-size:20px;font-weight:900;padding:0 12px;box-shadow:0 4px 0 rgba(40,30,90,.35)}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,30,90,.35)}
#bBeep{background:#ffe066}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px);pointer-events:none;z-index:3}
.pad{pointer-events:auto;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.28);border:4px solid rgba(255,255,255,.75);color:#fff;font-size:34px;font-weight:900;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.3);touch-action:none}
.pad small{font-size:13px;letter-spacing:1px;margin-top:2px}
.pad.on{background:rgba(255,224,102,.6)}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:rgba(40,20,90,.28);padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px)}
#menu.hide{display:none}
.panel{display:flex;flex-direction:row;gap:18px;align-items:center;background:rgba(255,255,255,.95);border-radius:30px;padding:14px 20px;max-width:min(96vw,780px);max-height:100%;box-shadow:0 10px 0 rgba(60,30,120,.35),0 20px 40px rgba(0,0,0,.2);color:#3b2a6b}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(20px,5.4vh,38px);font-weight:900;letter-spacing:.5px;color:#ff7a1c;text-shadow:0 3px 0 #3b2a6b;text-align:center;line-height:.95}
#preview{width:min(28vh,150px);height:min(28vh,150px)}
#mStats{font-size:17px;font-weight:800;text-align:center;line-height:1.35}
.lbl{font-size:16px;font-weight:800}
#swatches{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:380px}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px rgba(59,42,107,.25);position:relative}
.sw::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--acc,#fff)}
.sw.sel{box-shadow:0 0 0 5px #3b2a6b;transform:scale(1.08)}
.big{width:100%;min-width:220px;height:clamp(52px,14vh,72px);border-radius:24px;background:#3ddc84;color:#fff;font-size:clamp(24px,7vh,34px);font-weight:900;letter-spacing:1px;box-shadow:0 6px 0 #1f9a55;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #1f9a55}
.row{display:flex;gap:10px;width:100%}
.mid{flex:1;height:clamp(46px,11vh,56px);border-radius:18px;background:#ece6ff;color:#3b2a6b;font-size:18px;font-weight:900;box-shadow:0 4px 0 rgba(59,42,107,.3);padding:0 12px;white-space:nowrap}
.mid:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,107,.3)}
#mBeep{background:#ffe066}
#mRestart{width:100%;flex:none}
.tip{font-size:13px;font-weight:700;color:#6a5a99;text-align:center;max-width:380px;line-height:1.35}
.sides{display:flex;gap:10px;width:100%}
.sideb{flex:1;height:clamp(44px,11vh,54px);border-radius:18px;font-size:18px;font-weight:900;background:#ece6ff;color:#3b2a6b;box-shadow:0 4px 0 rgba(59,42,107,.3);white-space:nowrap;padding:0 10px}
#sGood.sel{background:#eaf6ff;color:#1a6ad0;box-shadow:0 0 0 4px #38b6ff,0 4px 0 #1a5aa6}
#sBad.sel{background:#1b1c22;color:#ff4a4a;box-shadow:0 0 0 4px #ff3b3b,0 4px 0 #000}
body.bad #menu{background:rgba(30,0,0,.35)}
body.bad .panel{background:rgba(30,31,38,.96);color:#eee;box-shadow:0 10px 0 rgba(120,10,10,.45),0 20px 40px rgba(0,0,0,.4)}
body.bad h1{color:#ff3b3b;text-shadow:0 3px 0 #000}
body.bad .tip{color:#a9acb8}
body.bad .mid,body.bad .sideb{background:#3a3d48;color:#eee;box-shadow:0 4px 0 #111}
body.bad #mBeep{background:#ff3b3b;color:#fff}
body.bad #sBad.sel{background:#0e0e12;color:#ff4a4a;box-shadow:0 0 0 4px #ff3b3b,0 4px 0 #000}
body.bad .sw{border-color:#4a4d58;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
body.bad .sw.sel{box-shadow:0 0 0 5px #ff3b3b}
body.bad #bBeep{background:#ff3b3b;color:#fff}
#bots{flex-wrap:wrap}
#bots .sideb{flex:1 1 30%;min-width:0;height:40px;font-size:13px;padding:0 4px}
#bots .sideb.sel{background:#eaf6ff;color:#1a6ad0;box-shadow:0 0 0 4px #38b6ff,0 4px 0 #1a5aa6}
#bots .sideb.sel.chop{background:#ffe0c2;color:#8a3b08;box-shadow:0 0 0 4px #e36b1e,0 4px 0 #a3440c}
body.bad #bots .sideb.sel{background:#2a3142;color:#9fd0ff;box-shadow:0 0 0 4px #38b6ff,0 4px 0 #111}
body.bad #bots .sideb.sel.chop{background:#ff8a1c;color:#1b1208;box-shadow:0 0 0 4px #ffb020,0 4px 0 #000}
body.chop #bBeep,body.chop #mBeep{background:#ffb020;color:#3b2a6b}
body.bad.chop #bBeep,body.bad.chop #mBeep{background:#ff6a2a;color:#fff}
#mColorLbl{text-align:center;max-width:380px}
#swatches .sw.classic{border-radius:14px;width:auto;min-width:76px;height:42px;padding:0 8px;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
#swatches .sw.classic::after{display:none}
#bay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:rgba(8,18,54,.55);padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px)}
#bay.hide{display:none}
#bay .panel{flex-direction:column;max-width:min(96vw,520px);width:min(96vw,520px)}
#shipcv{width:min(92vw,440px);height:110px}
#galaxy{display:flex;gap:6px;justify-content:center;width:100%;flex-wrap:wrap}
.star{width:58px;text-align:center;font-size:11px;font-weight:800;line-height:1.15}
.star i{display:block;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:#d9d3ea;box-shadow:0 0 0 3px #fff}
.star.now i{background:#7fd4ff;box-shadow:0 0 0 3px #1a6ad0}
.star.done i{background:#3ddc84;box-shadow:0 0 0 3px #1f9a55}
#fixes,#bayStats{font-size:15px;font-weight:800;text-align:center;line-height:1.4;max-width:440px}
#bayGo{font-size:22px;height:60px;line-height:1.1;padding:6px 12px}
@media (orientation:portrait){.panel{flex-direction:column;gap:8px;padding:12px}#swatches{gap:7px}.sw{width:42px;height:42px}#preview{width:112px;height:112px}#bots .sideb{height:36px;font-size:12px}}
@media (max-height:700px) and (orientation:portrait){#preview{width:100px;height:100px}.panel{gap:6px;padding:10px}.sideb{height:36px}}
@media (max-height:360px){.tip{display:none}#preview{width:110px;height:110px}.sideb{height:38px;font-size:15px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="left"><div id="power" aria-label="Power"></div><div id="score">0 m</div><div id="bolts">&#9881; 0</div></div>
  <div class="right"><button class="ui hb" id="bBeep" aria-label="Beep">Beep!</button><button class="ui hb" id="bMute" aria-label="Sound">&#128266;</button><button class="ui hb" id="bPause" aria-label="Pause">&#10074;&#10074;</button></div>
</div>
<div id="pad"><button id="bDown" class="pad" aria-label="Down">&#9660;<small>DOWN</small></button><button id="bJump" class="pad" aria-label="Jump">&#9650;<small>JUMP</small></button></div>

<div id="menu">
  <div class="panel">
    <div class="col">
      <h1 id="mTitle">ASTROMECH GALAXY RUN</h1>
      <canvas id="preview"></canvas>
      <div id="mStats"></div>
    </div>
    <div class="col">
      <div class="lbl">Pick a droid!</div>
      <div class="sides" id="bots"></div>
      <div class="sides"><button class="ui sideb" id="sGood">&#9733; Good side</button><button class="ui sideb" id="sBad">&#9889; Bad side</button></div>
      <div class="lbl" id="mColorLbl">Pick Rollo's colors!</div>
      <div id="swatches"></div>
      <button class="ui big" id="mPlay">&#9654; PLAY</button>
      <button class="ui mid" id="mRestart">&#8634; Start over</button>
      <div class="row"><button class="ui mid" id="mBeep">Beep!</button><button class="ui mid" id="mMute">&#128266; Sound</button></div>
      <div class="tip" id="mTip">Tap or swipe &#8593; to jump (tap again in the air for a double jump!)<br>Swipe &#8595; to drop down or zoom &middot; Drag &#8592; &#8594; for slow / fast</div>
    </div>
  </div>
</div>
<div id="bay" class="hide">
  <div class="panel">
    <h1 id="bayTitle">SHIP BAY</h1>
    <canvas id="shipcv" width="440" height="110"></canvas>
    <div id="galaxy"></div>
    <div id="fixes"></div>
    <div id="bayStats"></div>
    <button class="ui big" id="bayGo">Fix it!</button>
    <div class="tip" id="bayTip">Parts you collect fix the ship, then you fly to the next star.</div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------------- setup ----------------
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const pv = document.getElementById('preview'), pctx = pv.getContext('2d');
const $ = id => document.getElementById(id);
let W = 0, H = 0, DPR = 1, S = 1, VW = 0, VH = 0;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(H / 460, W / 600);
  VW = W / S; VH = H / S;
  const pr = pv.getBoundingClientRect();
  pv.width = Math.max(1, Math.round((pr.width || 150) * DPR));
  pv.height = Math.max(1, Math.round((pr.height || 150) * DPR));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

const store = {
  get(k, d) { try { const v = localStorage.getItem('rollo.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rollo.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------------- constants ----------------
const R = 34, G = 2300, JV = 880, JV2 = 800, MAXS = 600, TD = 28, TF = 12;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const GOOD = [
  { name: 'Orange', body: '#ff8a1c', accent: '#fff3dc', dark: '#b4520a', eye: '#5fe0ff' },
  { name: 'Blue',   body: '#2f9bff', accent: '#eaf6ff', dark: '#1a5aa6', eye: '#ffd34d' },
  { name: 'Green',  body: '#35cf57', accent: '#f4ffd8', dark: '#1f7a33', eye: '#ff7bd5' },
  { name: 'Purple', body: '#9a5cff', accent: '#f6e8ff', dark: '#5a2fb0', eye: '#7dffb2' },
  { name: 'Pink',   body: '#ff5fae', accent: '#fff0f7', dark: '#b02a6e', eye: '#6bf0ff' },
  { name: 'Rainbow', rainbow: true }
];
const BAD = [
  { name: 'Black and red', bad: true, body: '#18181e', accent: '#5c606c', dark: '#07070a', eye: '#ff2a2a', trim: '#ff2a2a' },
  { name: 'Black and chrome', bad: true, body: '#1c1d23', accent: '#cfd4de', dark: '#33363f', eye: '#ff7a1a', trim: '#ffffff' },
  { name: 'Dark purple and green', bad: true, body: '#2b1242', accent: '#3ee87a', dark: '#12061d', eye: '#7dff4d', trim: '#3ee87a' },
  { name: 'Black and orange', bad: true, body: '#151515', accent: '#ff8a1c', dark: '#000000', eye: '#ffb020', trim: '#ff8a1c' }
];
let side = store.get('side', 'good') === 'bad' ? 'bad' : 'good';
const colorSel = { good: clamp(store.get('color', 0) | 0, 0, GOOD.length - 1), bad: clamp(store.get('colorBad', 0) | 0, 0, BAD.length - 1) };
const presets = () => side === 'bad' ? BAD : GOOD;
function cols(t) {
  const p = presets()[colorSel[side]];
  if (!p.rainbow) return p;
  const h = (t * 80) % 360;
  return { rainbow: true, h, body: `hsl(${h},92%,58%)`, accent: `hsl(${(h + 40) % 360},100%,92%)`, dark: `hsl(${h},70%,32%)`, eye: `hsl(${(h + 180) % 360},100%,70%)` };
}

// ---------------- audio (Web Audio, unlocked on first touch) ----------------
let AC = null, master = null, muted = !!store.get('muted', false);
function unlockAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(AC.destination);
      const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
      s.buffer = b; s.connect(AC.destination); s.start(0);
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) {}
}
['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
function setMute(m) {
  muted = m; store.set('muted', m);
  if (master) master.gain.value = m ? 0 : 0.55;
  const icon = m ? '\u{1F507}' : '\u{1F50A}';
  $('bMute').textContent = icon;
  $('mMute').textContent = icon + (m ? ' Sound off' : ' Sound on');
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!AC || muted || AC.state !== 'running') return;
  vol = vol == null ? 0.25 : vol; delay = delay || 0;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  return o;
}
let noiseBuf = null;
function noise(dur, vol, f0, f1, delay) {
  if (!AC || muted || AC.state !== 'running') return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + (delay || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1 || f0, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  jump() { tone('square', 330, 660, 0.11, 0.13); tone('sine', 700, 1000, 0.08, 0.16, 0.07); },
  jump2() { tone('square', 520, 1250, 0.13, 0.12); tone('triangle', 1250, 1700, 0.09, 0.15, 0.09); },
  chirp(n) { const f = 880 * Math.pow(2, Math.min(n, 12) / 12); tone('sine', f, f * 1.5, 0.07, 0.18); tone('sine', f * 1.5, f * 2, 0.08, 0.13, 0.06); },
  bwomp() { tone('sawtooth', 260, 55, 0.42, 0.16); tone('square', 140, 45, 0.38, 0.1); },
  bonk() { tone('triangle', 300, 120, 0.18, 0.2); },
  land() { tone('sine', 150, 60, 0.1, 0.2); },
  boing() { const o = tone('sine', 180, 900, 0.45, 0.25); if (o) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 18; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency); l.start(); l.stop(AC.currentTime + 0.5); } },
  dash() { noise(0.35, 0.35, 400, 3000); tone('square', 200, 900, 0.25, 0.07); },
  pound() { tone('square', 900, 180, 0.2, 0.12); },
  smash() { noise(0.2, 0.4, 1500, 300); tone('triangle', 420, 90, 0.2, 0.18); },
  drop() { tone('sine', 800, 300, 0.15, 0.18); tone('sine', 400, 250, 0.08, 0.12, 0.12); },
  charge() { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.12, 0.17, i * 0.08)); },
  rescue() { tone('sine', 1300, 300, 0.55, 0.18); tone('sine', 300, 700, 0.3, 0.15, 0.6); },
  hazard(kind) {
    if (kind === 'coolant') { noise(0.4, 0.22, 1600, 320); tone('sine', 480, 160, 0.32, 0.08); }
    else if (kind === 'spark') { noise(0.14, 0.28, 2400, 280); tone('square', 920, 110, 0.1, 0.09); }
    else { noise(0.42, 0.24, 220, 70); tone('sawtooth', 90, 40, 0.36, 0.1); }
  },
  milestone() { [784, 988, 1175, 1568].forEach((f, i) => tone('square', f, f, 0.09, 0.08, i * 0.07)); },
  over() { [523, 440, 392, 330].forEach((f, i) => tone('triangle', f, f * 0.98, 0.2, 0.17, i * 0.2)); tone('sine', 330, 880, 0.25, 0.15, 0.85); },
  click() { tone('sine', 660, 880, 0.06, 0.15); },
  go() { tone('square', 523, 523, 0.1, 0.08); tone('square', 784, 784, 0.18, 0.09, 0.12); },
  chopTalk(n) {
    let t = 0;
    n = n || (2 + (Math.random() * 4 | 0));
    for (let i = 0; i < n; i++) {
      const f0 = rnd(95, 270);

      }
    }
    if (P.vy >= 0 && P.x >= p.x - 6 && P.x <= p.x + p.w + 6 && py <= p.y + 2 && P.y >= p.y) {
      if (p.thin && P.drop > 0 && p.y <= P.dropY + 4) continue;
      if (!landed || p.y < landed.y) landed = p;
    }
  }
  const was = P.ground;
  if (landed) {
    if (!was && P.vy > 350) {
      P.sq = Math.min(0.38, P.vy / 3200); sfx.land();
      for (let i = 0; i < (P.pound ? 16 : 6); i++) dust(P.x + rnd(-10, 10), landed.y, rnd(-260, 260) * (P.pound ? 1.4 : 0.7), rnd(-120, -20));
    }
    if (P.pound) {
      shake = 7; P.pound = false;
      for (const o of obs) if (!o.dead && o.type !== 'spring' && Math.abs(o.x + o.w / 2 - P.x) < 140 && Math.abs(o.y - landed.y) < 5) smash(o);
    }
    P.y = landed.y; P.vy = 0; P.jumps = 0; P.ground = landed; P.coyote = 0.12; P.rescue = 0; P.glide = 0;
    P.lastSafe = landed; P.safeX = P.x;
  } else {
    P.ground = null; P.coyote = Math.max(0, P.coyote - dt);
  }

  // obstacles
  const cx = P.x, cy = P.y - R;
  for (const o of obs) {
    if (o.dead) continue;
    o.boing = Math.max(0, o.boing - dt * 3);
    if (o.x > cx + 120 || o.x + o.w < cx - 120) continue;
    const nx = clamp(cx, o.x, o.x + o.w), ny = clamp(cy, o.y - o.h, o.y);
    const dd = Math.hypot(cx - nx, cy - ny);
    if (dd > R * 0.88) continue;
    if (o.type === 'spring') {
      if (P.vy >= -100 && cy < o.y - o.h + 4) {
        P.vy = -1300; P.jumps = 1; P.ground = null; P.pound = false; o.boing = 1; P.sq = -0.38; sfx.boing();
        sparks(o.x + o.w / 2, o.y - o.h, '#ff4d6d', 8); toast('BOING!', '#ff8fb1');
      }
      continue;
    }
    if (P.dash > 0 || P.pound || (P.vy > 50 && py - R < o.y - o.h)) {
      const fromTop = !P.dash && !P.ground;
      smash(o);
      if (fromTop) { P.vy = -650; P.pound = false; P.jumps = 1; P.sq = -0.2; }
      continue;
    }
    if (P.inv > 0) continue;
    hurt();
  }

  // items
  comboT -= dt; if (comboT <= 0) combo = 0;
  for (const it of items) {
    if (it.taken) continue;
    it.t += dt;
    const dx = P.x - it.x, dy = (P.y - R) - it.y, dd = Math.hypot(dx, dy);
    if (dd < 120 && it.type === 'bolt') { it.x += dx / dd * 420 * dt; it.y += dy / dd * 420 * dt; }
    if (dd < R + 22) {
      it.taken = true;
      if (it.type === 'bolt') { gainParts(1); combo++; comboT = 0.6; sfx.chirp(combo); sparks(it.x, it.y, it.kind === 'cell' ? '#7fd4ff' : '#ffd23f', 6); }
      else { if (power < 5) power++; sfx.charge(); confetti(it.x, it.y); popText(it.x, it.y - 30, '+1 cell', '#7dffe0'); toast('Power cell!', '#7dffe0'); }
    }
  }

  // fell in a pit?
  if (P.rescue <= 0) {
    let lowest = -1e9;
    for (const p of plats) if (p.x < P.x + 700 && p.x + p.w > P.x - 500) lowest = Math.max(lowest, p.y);
    if (P.y > lowest + 520 || (P.y - R > pitY + 10 && P.y > lowest + 10)) { sparks(P.x, Math.min(P.y, pitY), TH().energy[0], 14); rescue(); }
  }

  // milestone
  if (dist() >= nextMile) { toast(nextMile + ' m! Woo-hoo!', '#ffe066'); sfx.milestone(); confetti(P.x + 200, P.y - 200); nextMile += 250; }

  // body animation
  P.angle += P.vx * dt / R;
  P.sqv += (-170 * P.sq - 13 * P.sqv) * dt; P.sq += P.sqv * dt;
  P.lean += ((clamp((target - P.vx) / -900, -0.3, 0.3) + (P.ground ? 0 : clamp(P.vy / 4000, -0.15, 0.15))) - P.lean) * Math.min(1, dt * 8);
  P.antv += (-120 * P.ant - 6 * P.antv - (P.vx - (P.pvx || 0)) * 0.5 - (P.vy - (P.pvy || 0)) * 0.2) * dt;
  P.ant += P.antv * dt; P.ant = clamp(P.ant, -0.9, 0.9);
  P.pvx = P.vx; P.pvy = P.vy;
  if (P.ground && Math.abs(P.vx) > 100) {
    P.dustT -= dt;
    if (P.dustT <= 0) { P.dustT = P.dash > 0 ? 0.02 : 0.07; dust(P.x - R * 0.5, P.y - 2, -P.vx * rnd(0.1, 0.35), rnd(-60, -10)); }
  }
  if (droid().flight && !P.ground) {
    P.puffT -= dt;
    if (P.puffT <= 0) {
      P.puffT = P.jumps >= 2 ? 0.028 : 0.05;
      dust(P.x + rnd(-8, 8), P.y + rnd(-2, 8), rnd(-36, 24), rnd(30, 130), 'rgba(255,150,40,');
      dust(P.x + rnd(-6, 6), P.y + rnd(0, 10), rnd(-16, 16), rnd(8, 70), 'rgba(120,120,128,');
    }
  }

  // camera
  const tx = P.x - VW * 0.28;
  cam.x += (tx - cam.x) * Math.min(1, dt * 10);
  const refY = P.ground ? P.y : (P.lastSafe ? P.lastSafe.y : P.y);
  let ty = Math.min(refY - VH * 0.62, P.y - R * 2 - VH * 0.22);
  ty = Math.max(ty, P.y - VH * 0.75);
  if (P.lastSafe) ty = Math.min(ty, P.lastSafe.y - VH * 0.62 + 260);
  cam.y += (ty - cam.y) * Math.min(1, dt * (P.ground ? 4 : 2.5));
  if (droid().id === 'r5d4' && P.ground && Math.random() < dt * 3) sparks(P.x + rnd(-8, 8), P.y - rnd(6, 24), '#ffb020', 1);
  if (droid().move === 'stealth' && P.moveT > 0) dust(P.x, P.y - 8, rnd(-20, 10), rnd(-20, 10), 'rgba(198,161,94,');
  if (!P.dead && dist() >= curDist()) openBay();
}

function updateFx(dt) {
  for (const p of parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.kind === 'dust') { p.vx *= 0.92; p.vy *= 0.92; p.size += dt * 18; }
    if (p.kind === 'conf') p.r += dt * 8;
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 400) parts.splice(0, parts.length - 400);
  for (const t of toasts) t.t -= dt;
  toasts = toasts.filter(t => t.t > 0);
  bubble.t = Math.max(0, bubble.t - dt);
  previewBubble = Math.max(0, previewBubble - dt);
  shake = Math.max(0, shake - dt * 30);
  if (P) { P.blink -= dt; if (P.blink < -0.12) P.blink = rnd(2, 4.5); }
}

// ---------------- drawing helpers ----------------
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function cellIcon(c, x, y, s) {
  const w = s * 0.7, h = s * 1.15;
  c.save(); c.translate(x, y);
  c.fillStyle = '#12382e'; c.strokeStyle = '#2b2346'; c.lineWidth = Math.max(1.5, s * 0.1);
  rr(c, -w / 2, -h / 2, w, h, s * 0.12); c.fill(); c.stroke();
  c.fillStyle = '#2b2346'; c.fillRect(-w * 0.18, -h / 2 - s * 0.16, w * 0.36, s * 0.18);
  c.fillStyle = '#7dffe0'; c.fillRect(-w * 0.26, -h * 0.28, w * 0.52, h * 0.55);
  c.restore();
}
function star(c, x, y, r) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } c.closePath(); }
function gear(c, x, y, r, a, fill) {
  c.save(); c.translate(x, y); c.rotate(a);
  c.beginPath();
  const n = 8;
  for (let i = 0; i < n * 2; i++) { const a0 = i * Math.PI / n, rad = i % 2 ? r * 0.78 : r; c.arc(0, 0, rad, a0 - Math.PI / n / 2, a0 + Math.PI / n / 2); }
  c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = r * 0.16; c.strokeStyle = '#a86a00'; c.stroke();
  c.beginPath(); c.arc(0, 0, r * 0.32, 0, Math.PI * 2); c.fillStyle = '#fff7cc'; c.fill(); c.stroke();
  c.restore();
}

// The robot: rolling sphere body + dome head that stays on top + antenna + one big eye
function drawRobot(c, x, y, r, o) {
  const col = o.col;
  c.save(); c.translate(x, y); c.scale(o.sx, o.sy);
  if (o.alpha != null) c.globalAlpha = o.alpha;
  const lw = r * 0.075;
  // body
  c.beginPath(); c.arc(0, -r, r, 0, Math.PI * 2); c.fillStyle = col.body; c.fill();
  c.save(); c.clip();
  c.translate(0, -r); c.rotate(o.angle);
  for (let i = 0; i < 3; i++) {
    const a = i * Math.PI * 2 / 3;
    const pcx = Math.cos(a) * r * 0.56, pcy = Math.sin(a) * r * 0.56;
    const pc = col.rainbow ? `hsl(${(col.h + i * 120) % 360},100%,85%)` : col.accent;
    c.beginPath(); c.arc(pcx, pcy, r * 0.4, 0, Math.PI * 2); c.fillStyle = pc; c.fill();
    c.lineWidth = lw * 0.8; c.strokeStyle = col.dark; c.stroke();
    c.beginPath(); c.arc(pcx, pcy, r * 0.22, 0, Math.PI * 2); c.fillStyle = col.body; c.fill(); c.stroke();
    if (col.trim) { c.lineWidth = lw * 0.55; c.strokeStyle = col.trim; c.beginPath(); c.arc(pcx, pcy, r * 0.31, 0, Math.PI * 2); c.stroke(); c.lineWidth = lw * 0.8; c.strokeStyle = col.dark; }
    c.beginPath(); c.arc(pcx, pcy, r * 0.07, 0, Math.PI * 2); c.fillStyle = col.dark; c.fill();
    const ba = a + Math.PI / 3;
    c.beginPath(); c.arc(Math.cos(ba) * r * 0.72, Math.sin(ba) * r * 0.72, r * 0.06, 0, Math.PI * 2); c.fillStyle = col.dark; c.fill();
  }
  c.beginPath(); c.arc(0, 0, r * 0.13, 0, Math.PI * 2); c.fillStyle = col.dark; c.fill();
  c.restore();
  // shading
  let g = c.createRadialGradient(-r * 0.4, -r * 1.45, r * 0.05, 0, -r, r * 1.05);
  g.addColorStop(0, 'rgba(255,255,255,0.75)'); g.addColorStop(0.35, 'rgba(255,255,255,0.08)'); g.addColorStop(0.8, 'rgba(0,0,0,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0.32)');
  c.beginPath(); c.arc(0, -r, r, 0, Math.PI * 2); c.fillStyle = g; c.fill();
  c.lineWidth = lw; c.strokeStyle = '#2b2346'; c.stroke();
  if (col.bad) {
    c.beginPath(); c.ellipse(-r * 0.4, -r * 1.55, r * 0.22, r * 0.12, -0.6, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,0.65)'; c.fill();
    c.beginPath(); c.arc(0, -r, r * 0.96, -0.2, 1.3); c.strokeStyle = 'rgba(255,255,255,0.28)'; c.lineWidth = lw * 0.8; c.stroke();
  }

  // head (stays on top, leans a little)
  c.save();
  c.translate(0, -r * 1.95); c.rotate(o.lean || 0); c.translate(0, r * 1.95);
  const bad = !!col.bad;
  const hx = 0, hb = -r * 1.82, hc = -r * 2.02, hrx = r * 0.66, hry = r * 0.62;
  const topY = bad ? -r * 2.4 : hc - hry;
  // antenna
  const ax = -r * 0.26, ay = bad ? topY + r * 0.04 : hc - hry * 0.9;
  const aa = -Math.PI / 2 - (bad ? 0.1 : 0.25) + (o.ant || 0) * (bad ? 0.6 : 1);
  const alen = bad ? r * 0.62 : r * 0.78;
  const tipx = ax + Math.cos(aa) * alen, tipy = ay + Math.sin(aa) * alen;
  c.beginPath(); c.moveTo(ax, ay + r * 0.1);
  if (bad) c.lineTo(tipx, tipy); else c.quadraticCurveTo(ax + Math.cos(aa) * r * 0.3, ay + Math.sin(aa) * r * 0.5, tipx, tipy);
  c.lineWidth = lw * (bad ? 0.9 : 1.1); c.strokeStyle = '#2b2346'; c.lineCap = 'round'; c.stroke();
  if (bad) {
    const pulse = 0.55 + 0.45 * Math.sin(o.t * 5);
    const gg = c.createRadialGradient(tipx, tipy, 0, tipx, tipy, r * 0.4);
    gg.addColorStop(0, `rgba(255,40,40,${0.7 * pulse})`); gg.addColorStop(1, 'rgba(255,40,40,0)');
    c.fillStyle = gg; c.fillRect(tipx - r * 0.4, tipy - r * 0.4, r * 0.8, r * 0.8);
    c.beginPath(); c.arc(tipx, tipy, r * 0.11, 0, Math.PI * 2); c.fillStyle = '#ff2a2a'; c.fill(); c.lineWidth = lw * 0.6; c.stroke();
  } else {
    c.beginPath(); c.arc(tipx, tipy, r * 0.13, 0, Math.PI * 2);
    c.fillStyle = (Math.sin(o.t * 6) > 0) ? '#ff4d6d' : '#ffd23f'; c.fill(); c.lineWidth = lw * 0.7; c.stroke();
  }
  // propeller hat
  if (o.prop) {
    const py2 = topY - r * 0.05;
    c.fillStyle = '#ffd23f'; c.strokeStyle = '#2b2346'; c.lineWidth = lw * 0.7;
    c.beginPath(); c.ellipse(0, py2, r * 0.34, r * 0.16, 0, Math.PI, Math.PI * 2); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, py2 - r * 0.12); c.lineTo(0, py2 - r * 0.4); c.stroke();
    const bw = Math.abs(Math.cos(o.t * 28)) * r * 0.9 + r * 0.1;
    c.fillStyle = '#ff4d6d';
    c.beginPath(); c.ellipse(0, py2 - r * 0.42, bw, r * 0.08, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  // dome
  if (bad) {
    const bw2 = r * 0.74;
    c.beginPath(); c.moveTo(-bw2, hb); c.lineTo(-r * 0.68, -r * 2.22); c.lineTo(-r * 0.44, topY); c.lineTo(r * 0.44, topY); c.lineTo(r * 0.68, -r * 2.22); c.lineTo(bw2, hb);
    c.quadraticCurveTo(0, -r * 2.14, -bw2, hb); c.closePath();
    c.fillStyle = col.body; c.fill();
    c.save(); c.clip();
    c.fillStyle = col.accent; c.fillRect(-bw2, -r * 1.98, bw2 * 2, r * 0.09);
    c.fillStyle = col.trim; c.fillRect(-bw2, -r * 1.89, bw2 * 2, r * 0.035);
    g = c.createLinearGradient(0, topY, 0, -r * 2.05);
    g.addColorStop(0, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(-bw2, topY, bw2 * 2, r * 0.22);
    c.restore();
    c.lineWidth = lw; c.strokeStyle = '#2b2346'; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.3)'; c.lineWidth = lw * 0.6;
    c.beginPath(); c.moveTo(-r * 0.4, topY + lw); c.lineTo(r * 0.4, topY + lw); c.stroke();
    // small side light
    c.beginPath(); c.arc(-r * 0.42, -r * 2.12, r * 0.06, 0, Math.PI * 2); c.fillStyle = Math.sin(o.t * 3) > 0 ? col.eye : '#444'; c.fill();
    // glowing eye with grumpy lid
    const ex = r * 0.2 + (o.look || 0) * r * 0.04, ey = -r * 2.12, er = r * 0.2;
    const gl = c.createRadialGradient(ex, ey, 0, ex, ey, er * 2.2);
    gl.addColorStop(0, col.eye); gl.addColorStop(1, 'rgba(255,0,0,0)');
    c.save(); c.globalAlpha *= 0.45; c.fillStyle = gl; c.beginPath(); c.arc(ex, ey, er * 2.2, 0, Math.PI * 2); c.fill(); c.restore();
    c.beginPath(); c.arc(ex, ey, er * 1.15, 0, Math.PI * 2); c.fillStyle = '#050507'; c.fill();
    if (o.dizzy) {
      c.strokeStyle = col.eye; c.lineWidth = r * 0.045; c.beginPath();
      for (let i = 0; i < 26; i++) { const a = i * 0.55 + o.t * 10, rad = er * 0.95 * i / 26; c.lineTo(ex + Math.cos(a) * rad, ey + Math.sin(a) * rad); }
      c.stroke();
    } else {
      const bl = o.blink ? 0.15 : 1;
      c.save(); c.translate(ex, ey); c.scale(1, bl);
      c.beginPath(); c.arc(0, 0, er * 0.82, 0, Math.PI * 2); c.fillStyle = col.eye; c.fill();
      c.beginPath(); c.arc(r * 0.02, 0, er * 0.36, 0, Math.PI * 2); c.fillStyle = '#fff6e0'; c.fill();
      c.restore();
      // grumpy (or smug) eyelid slanting down toward the front
      const lo = o.happy ? 0.15 : -0.25;
      c.beginPath();
      c.moveTo(ex - er * 1.5, ey - er * 1.6); c.lineTo(ex + er * 1.5, ey - er * 1.6);
      c.lineTo(ex + er * 1.5, ey + er * (lo + 0.15)); c.lineTo(ex - er * 1.5, ey + er * (lo - 0.75)); c.closePath();
      c.fillStyle = col.body; c.fill();
      c.beginPath(); c.moveTo(ex - er * 1.3, ey + er * (lo - 0.7)); c.lineTo(ex + er * 1.35, ey + er * (lo + 0.12));
      c.strokeStyle = col.trim; c.lineWidth = r * 0.07; c.lineCap = 'round'; c.stroke();
    }
    c.restore();
    c.restore();
    return;
  }
  c.beginPath(); c.moveTo(-hrx, hb); c.lineTo(-hrx, hc); c.ellipse(hx, hc, hrx, hry, 0, Math.PI, Math.PI * 2); c.lineTo(hrx, hb);
  c.quadraticCurveTo(0, -r * 2.16, -hrx, hb); c.closePath();
  c.fillStyle = col.accent; c.fill();
  c.save(); c.clip();
  c.fillStyle = col.body; c.fillRect(-hrx, hc - r * 0.02, hrx * 2, r * 0.13);
  c.fillStyle = col.dark; c.fillRect(-hrx, hc + r * 0.11, hrx * 2, r * 0.05);
  g = c.createRadialGradient(-r * 0.25, hc - hry * 0.7, r * 0.02, 0, hc, hrx * 1.1);
  g.addColorStop(0, 'rgba(255,255,255,0.8)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,0.18)');
  c.fillStyle = g; c.fillRect(-hrx, hc - hry, hrx * 2, hry * 1.4);
  c.restore();
  c.lineWidth = lw; c.strokeStyle = '#2b2346'; c.stroke();
  // little light
  c.beginPath(); c.arc(-r * 0.36, hc - r * 0.24, r * 0.065, 0, Math.PI * 2); c.fillStyle = col.dark; c.fill();
  // eye
  const ex = r * 0.2 + (o.look || 0) * r * 0.06, ey = hc - r * 0.26, er = r * 0.25;
  c.beginPath(); c.arc(ex, ey, er * 1.12, 0, Math.PI * 2); c.fillStyle = '#2b2346'; c.fill();
  if (o.dizzy) {
    c.strokeStyle = '#ffffff'; c.lineWidth = r * 0.045; c.beginPath();
    for (let i = 0; i < 26; i++) { const a = i * 0.55 + o.t * 10, rad = er * 0.9 * i / 26; c.lineTo(ex + Math.cos(a) * rad, ey + Math.sin(a) * rad); }
    c.stroke();
  } else if (o.happy) {
    c.strokeStyle = col.eye; c.lineWidth = r * 0.08; c.lineCap = 'round';
    c.beginPath(); c.arc(ex, ey + er * 0.25, er * 0.55, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
  } else {
    const bl = o.blink ? 0.12 : 1;
    c.save(); c.translate(ex, ey); c.scale(1, bl);
    c.beginPath(); c.arc(0, 0, er * 0.78, 0, Math.PI * 2); c.fillStyle = col.eye; c.fill();
    c.beginPath(); c.arc(r * 0.03, 0, er * 0.42, 0, Math.PI * 2); c.fillStyle = '#16122a'; c.fill();
    c.beginPath(); c.arc(-er * 0.25, -er * 0.3, er * 0.2, 0, Math.PI * 2); c.fillStyle = '#ffffff'; c.fill();
    c.restore();
  }
  c.restore();
  c.restore();
}

// Side-on astromechs. Bodies stay upright; rolling only tips the whole droid back a little.
function drawLegged(c, x, y, r, o, d) {
  const K = d.classic;
  const C = o.col || K;
  const ink = '#2b2346';
  const VIS = 1.16;
  const panel = C.body;
  const panelDark = C.dark || K.dark || '#222';
  const shell = K.accent;
  const metal = K.metal || '#d5dde6';
  const eyeCol = K.eye;
  const gold = K.metal || K.trim || '#c6a15e';
  const goldHi = K.trim || '#e8d7a8';
  const q5 = d.id === 'r2q5';
  const r5 = d.id === 'r5d4';
  const chop = d.id === 'chopper';
  const lw = Math.max(1.8, r * 0.058);
  const tuck = chop ? clamp(o.tuck || 0, 0, 1) : 0;
  const fly = !!(o.air || o.prop) && !!d.flight;
  const wob = (d.wobble || 0) * (0.065 * Math.sin((o.t || 0) * 14) + ((o.moveT || 0) > 0 ? 0.09 * Math.sin((o.t || 0) * 28) : 0));
  const lean = clamp(o.rock || 0, 0, 1) * 0.31 * (1 - tuck * 0.75) + wob;

  c.save();
  c.translate(x, y);
  c.scale((o.sx || 1) * VIS, (o.sy || 1) * VIS);
  if (o.alpha != null) c.globalAlpha = o.alpha;

      rr(ctx, -7, -13, 14, 24, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff3a8'; ctx.fillRect(-7, -4, 14, 4);
      ctx.fillStyle = '#a86a00'; ctx.fillRect(-3, -17, 6, 5);
      ctx.restore();
    } else gear(ctx, it.x, y, 15, T * 2 + it.t, '#ffd23f');
  } else { const s = 20 * (1 + Math.sin(T * 6) * 0.08); cellIcon(ctx, it.x, y, s); }
}
function drawParts() {
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.kind === 'dust') { ctx.fillStyle = p.color + (a * 0.7).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }

    else if (p.kind === 'text') { ctx.globalAlpha = a; ctx.font = '900 30px ui-rounded, "Arial Rounded MT Bold", sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#2b2346'; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1; }
  }
}
function robotOpts(t) {
  const sq = P.sq;
  const o = { col: resolvedPaint(t), angle: P.angle, sx: 1 + sq * 0.8, sy: 1 - sq, lean: P.lean, look: clamp(P.vy / -800, -1, 1), blink: P.blink < 0, happy: P.happy > 0 || state === 'over', dizzy: P.dizzy > 0, ant: P.ant, prop: P.rescue > 0, t,
    dome: P.dome || 0, air: !P.ground && !(P.rescue > 0), zap: P.zap || 0, jumps: P.jumps || 0, phase: state === 'play' ? P.angle : T * 2.6,
    rock: P.rock || 0, tuck: P.tuck || 0, moveT: P.moveT || 0, headLean: clamp(Math.max(0, (P.vx || 0) - 150) / 1000, 0, 0.26) };

}
function drawBot(c, x, y, r, o) {
  const d = droid();

  else drawLegged(c, x, y, r, o, d);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBG();
  const shx = shake ? rnd(-shake, shake) : 0, shy = shake ? rnd(-shake, shake) : 0;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, (-cam.x + shx) * DPR * S, (-cam.y + shy) * DPR * S);
  drawPit();
  for (const p of plats) if (!p.thin) drawPlat(p);
  for (const p of plats) if (p.thin) drawPlat(p);
  for (const o of obs) drawObs(o);
  for (const it of items) drawItem(it);
  if (P) {
    // shadow on the surface below
    let sp = null;
    for (const p of plats) if (P.x >= p.x && P.x <= p.x + p.w && p.y >= P.y - 1 && (!sp || p.y < sp.y)) sp = p;
    if (sp) { const kk = clamp(1 - (sp.y - P.y) / 420, 0.25, 1); ctx.fillStyle = `rgba(30,20,60,${0.28 * kk})`; ctx.beginPath(); ctx.ellipse(P.x, sp.y + 2, R * 1.05 * kk, R * 0.3 * kk, 0, 0, 7); ctx.fill(); }
    const o = robotOpts(T);

    if (P.dash > 0) { ctx.globalAlpha = 0.25; drawBot(ctx, P.x - 40, P.y, R, Object.assign({}, o, { alpha: 0.25 })); drawBot(ctx, P.x - 20, P.y, R, Object.assign({}, o, { alpha: 0.35 })); ctx.globalAlpha = 1; }

  drawParts();
  // toasts
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  toasts.forEach((t, i) => {
    const a = Math.min(1, t.t * 3), sc = 1 + Math.max(0, t.t - 1.2) * 2;
    const fs = Math.round(clamp(W / 18, 22, 44) * sc);
    ctx.globalAlpha = a; ctx.font = `900 ${fs}px ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const y = H * 0.2 + i * fs * 1.2;
    ctx.lineWidth = fs * 0.2; ctx.strokeStyle = '#3b2a6b'; ctx.strokeText(t.text, W / 2, y, W * 0.9);

}
function drawPreview() {
  const c = pctx, w = pv.width, h = pv.height;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
  const g = c.createRadialGradient(w / 2, h * 0.55, 4, w / 2, h * 0.55, w * 0.55);
  if (side === 'bad') { g.addColorStop(0, 'rgba(255,70,50,0.55)'); g.addColorStop(1, 'rgba(255,70,50,0)'); } else { g.addColorStop(0, 'rgba(160,230,255,0.9)'); g.addColorStop(1, 'rgba(160,230,255,0)'); }
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const r = w * 0.2;
  const legged = droid().kind === 'legs';
  const hop = legged ? 0 : Math.abs(Math.sin(T * 3));
  const bounce = hop * r * 0.22;
  const sq = legged ? 0 : Math.max(0, 0.12 - Math.abs(Math.sin(T * 3)) * 0.5);
  c.fillStyle = 'rgba(30,20,60,0.2)'; c.beginPath(); c.ellipse(w / 2, h * 0.9, r * 1.05, r * 0.22, 0, 0, 7); c.fill();
  const hp = previewBubble > 0;
  const showZap = bot === 'chopper' && (T % 4.8) > 4.5;
  const airPreview = !!droid().flight && (T % 5.5) > 4.85;
  drawBot(c, w / 2, h * 0.9 - bounce, r, { col: resolvedPaint(T), angle: T * 2, phase: T * 3.2, sx: 1 + sq, sy: 1 - sq, lean: Math.sin(T * 2) * 0.08, look: 0, blink: P ? P.blink < 0 : false, happy: hp || state === 'over', dizzy: false, ant: Math.sin(T * 5) * 0.3, prop: false, t: T, dome: Math.sin(T * 0.9) * 0.28, air: airPreview, zap: showZap ? 0.3 : 0, jumps: airPreview ? 2 : 0, rock: 0, tuck: airPreview && droid().flight === 'center' ? 1 : 0, moveT: (!showZap && (T % 4.8) > 4.45) ? 0.5 : 0 });

    const fs = Math.round(w * 0.1); c.font = `900 ${fs}px ui-rounded, "Arial Rounded MT Bold", sans-serif`;
    const tw = Math.min(c.measureText(bubble.text).width, w * 0.9);
    c.fillStyle = side === 'bad' ? '#1b1c22' : '#fff'; c.strokeStyle = side === 'bad' ? '#ff3b3b' : '#2b2346'; c.lineWidth = w * 0.015;
    rr(c, w / 2 - tw / 2 - w * 0.04, h * 0.02, tw + w * 0.08, fs * 1.5, fs * 0.6); c.fill(); c.stroke();
    c.fillStyle = side === 'bad' ? '#fff' : '#3b2a6b'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(bubble.text, w / 2, h * 0.02 + fs * 0.78, w * 0.9);
    c.restore();
  }
}

// ---------------- HUD ----------------
let hudCache = '';
function updHud(force) {
  const need = touring() ? '' : ('/' + SYSTEMS[galaxy].need);
  const s = dist() + '|' + partsBank + '|' + power + '|' + galaxy;
  if (!force && s === hudCache) return; hudCache = s;
  const slots = Math.max(3, power);
  let cells = '';
  for (let i = 0; i < slots; i++) {
    const full = i < power;
    cells += '<span class="cell' + (full ? '' : ' off') + (full && power === 1 ? ' warn' : '') + '"></span>';
  }
  const meter = $('power');
  meter.innerHTML = cells;
  meter.setAttribute('aria-label', power + (power === 1 ? ' power cell' : ' power cells'));
  $('score').textContent = dist() + '/' + curDist() + ' m';
  $('bolts').textContent = '\u2699 ' + partsBank + need;
}

// ---------------- loop ----------------
let last = 0;
function loop(ts) {
  const now = ts / 1000; let dt = now - (last || now); last = now;
  dt = Math.min(dt, 1 / 30);
  T += dt;
  if (state === 'play') { update(dt); updHud(); }
  else if (state === 'title' && P) { cam.x = P.x - VW * 0.28 + Math.sin(T * 0.4) * 30; P.angle += dt * 1.5; tickDroid(dt); tickMutter(dt); }
  updPit(dt);
  updateFx(dt);
  draw();
  if (!$('menu').classList.contains('hide')) drawPreview();
  if (!$('bay').classList.contains('hide')) drawShip();
  requestAnimationFrame(loop);
}

// expose a tiny hook for automated testing
window.__rollo = { get state() { return state; }, get player() { return P; }, get power() { return power; }, set power(n) { power = n; updHud(true); }, get bolts() { return bolts; }, get bot() { return bot; }, get side() { return side; }, start: startGame, jump: doJump, down: doDown, say, setBot(b) { setBot(b, false); }, setSide(s) { setSide(s, false); },
  draw(id, c, x, y, r, extra) {
    const prev = bot;
    bot = normalizeDroid(id);
    const d0 = droid();
    const o = Object.assign({ col: d0.classic, angle: 0.15, phase: 0.4, sx: 1, sy: 1, lean: 0, look: 0, blink: false, happy: false, dizzy: false, ant: 0, prop: false, t: 0.2, dome: 0, air: false, zap: 0, jumps: 0, rock: 0, tuck: 0, moveT: 0, headLean: 0 }, extra || {});
    drawBot(c, x, y, r, o);
    bot = prev;
  } };

resize();
setMute(muted);
setSide(side, false);
setBot(bot, false);
newGame();
showMenu('title');
requestAnimationFrame(loop);
})();
